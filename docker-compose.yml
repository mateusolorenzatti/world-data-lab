services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: >
        -c shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - infra_network

  jupyter:
    build:
      context: ./infra/python
      dockerfile: ./Dockerfile.jupyter
    container_name: jupyter
    env_file: .env
    user: "${NB_UID}:${NB_GID}"
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      SPARK_OPTS: "--driver-memory 4g --executor-memory 4g"
      POSTGRES_DB: ${WDL_DB}
      POSTGRES_USER: ${WDL_USER}
      POSTGRES_PASSWORD: ${WDL_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./pipelines:/home/jovyan/work
    command: start-notebook.sh --NotebookApp.token=${JUPYTER_TOKEN} --NotebookApp.allow_origin='*'
    depends_on:
      - postgres
    networks:
      - infra_network

  airflow-init:
    build:
      context: ./infra/airflow
      dockerfile: ./Dockerfile.airflow
    container_name: airflow-init
    entrypoint: >
      bash -lc "airflow db migrate"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW__CORE__FERNET_KEY: "airflowfernetkey"
    depends_on:
      - postgres
    networks:
      - infra_network

  airflow-api-server:
    build:
      context: ./infra/airflow
      dockerfile: ./Dockerfile.airflow
    container_name: airflow-api-server
    command: api-server
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW__CORE__FERNET_KEY: "airflowfernetkey"
      AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
      AIRFLOW__WEBSERVER__SECRET_KEY: "seu_secret_key_muito_seguro_aqui"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./infra/airflow:/opt/airflow/custom_scripts
      - ./pipelines:/opt/airflow/notebooks
    networks:
      - infra_network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    build:
      context: ./infra/airflow
      dockerfile: ./Dockerfile.airflow
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
      AIRFLOW__CORE__FERNET_KEY: "airflowfernetkey"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./infra/airflow:/opt/airflow/custom_scripts
      - ./pipelines:/opt/airflow/notebooks
    networks:
      - infra_network
    restart: always

volumes:
  postgres_data:

networks:
  infra_network:
    driver: bridge